# 러닝봄 Preview APK를 GitHub Actions에서 빌드해 항상 최신 설치본을 배포한다. 정식 Play 앱은 건드리지 않는다.
name: Preview APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Preview versionCode 덮어쓰기(비우면 app.config.js 기본값 사용)'
        required: false
        type: string
      publish_release:
        description: 'GitHub Release 게시 여부'
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/preview-apk.yml'

permissions:
  contents: read

concurrency:
  group: preview-apk
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE: kr.robom.runningbom.preview
  FORBIDDEN_PACKAGE: kr.robom.runningbom
  APK_NAME: runningbom-preview.apk

jobs:
  preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node 22 준비
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: JDK 17 준비
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: 모바일 의존성 설치
        run: npm --prefix apps/mobile ci

      # 품질 게이트: 하나라도 실패하면 APK를 만들지 않는다(fail-closed).
      - name: 테스트
        run: npm --prefix apps/mobile test

      - name: 타입·설정·번들 검증
        run: npm --prefix apps/mobile run check

      - name: Preview 버전 확인 및 정식 패키지 유출 사전 차단
        id: version
        working-directory: apps/mobile
        env:
          RUNNINGBOM_VARIANT: preview
          PREVIEW_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          npx --yes expo config --type public --json > /tmp/preview-config.json
          APP_VERSION="$(node -p "require('/tmp/preview-config.json').version")"
          VERSION_CODE="$(node -p "require('/tmp/preview-config.json').android.versionCode")"
          PACKAGE="$(node -p "require('/tmp/preview-config.json').android.package")"
          APP_NAME="$(node -p "require('/tmp/preview-config.json').name")"

          echo "이름=$APP_NAME 패키지=$PACKAGE 버전=$APP_VERSION versionCode=$VERSION_CODE"

          if [ "$PACKAGE" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Preview 설정의 패키지가 $PACKAGE 입니다. $EXPECTED_PACKAGE 여야 합니다. 빌드를 중단합니다."
            exit 1
          fi

          {
            echo "app_version=$APP_VERSION"
            echo "version_code=$VERSION_CODE"
            echo "tag=preview-v$APP_VERSION-$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"

      # EAS 원격 빌드 크레딧을 쓰지 않도록 러너에서 직접 빌드한다.
      # EXPO_TOKEN으로 EAS에 저장된 기존 Preview 서명 키를 그대로 사용해야 덮어쓰기 업데이트가 된다.
      - name: 서명 경로 결정
        id: signing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${EXPO_TOKEN:-}" ]; then
            echo "mode=eas" >> "$GITHUB_OUTPUT"
            echo "기존 EAS 서명 키를 사용합니다. 설치된 Preview 앱에 덮어쓰기 업데이트됩니다."
          else
            echo "mode=selfsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_TOKEN이 없어 자체 서명으로 빌드합니다. 기존 Preview 앱과 서명이 달라 재설치가 필요하고 그 앱의 로컬 기록은 초기화됩니다."
          fi

      # 1순위: EXPO_TOKEN이 있으면 EAS에 저장된 기존 Preview 서명 키를 그대로 써서
      # 설치된 앱에 덮어쓰기 업데이트가 되게 한다. 원격 빌드 크레딧은 --local로 소모하지 않는다.
      - name: EAS 로컬 Preview APK 빌드 (기존 서명 유지)
        if: steps.signing.outputs.mode == 'eas'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PREVIEW_VERSION_CODE: ${{ inputs.version_code }}
          EAS_NO_VCS: '1'
        run: |
          set -euo pipefail
          if ! npx --yes eas-cli@latest build \
              --platform android \
              --profile preview \
              --local \
              --non-interactive \
              --output "$APK_NAME"; then
            echo "::error::EAS 로컬 빌드가 실패했습니다. 위 Gradle/EAS 로그에서 원인을 확인하세요."
            exit 1
          fi
          if [ ! -s "$APK_NAME" ]; then
            echo "::error::빌드는 끝났지만 $APK_NAME 산출물이 없습니다(조용한 성공 금지)."
            exit 1
          fi

      # 2순위: 토큰이 없어도 회장이 화면을 볼 수 있도록 자체 서명 APK를 만든다.
      # 서명이 기존과 달라 덮어쓰기 업데이트는 불가능하며, 릴리스 본문에 그 사실을 명시한다.
      - name: 자체 서명 Preview APK 빌드 (대체 경로)
        if: steps.signing.outputs.mode == 'selfsigned'
        working-directory: apps/mobile
        env:
          RUNNINGBOM_VARIANT: preview
          PREVIEW_VERSION_CODE: ${{ inputs.version_code }}
          EXPO_PUBLIC_RELEASE_CHANNEL: preview
          EXPO_PUBLIC_COMMUNITY_MODE: CORE_ONLY
          EXPO_PUBLIC_SOCIAL_ENABLED: 'false'
          EXPO_PUBLIC_AUTH_GOOGLE_ENABLED: 'false'
          EXPO_PUBLIC_AUTH_KAKAO_ENABLED: 'false'
          EXPO_PUBLIC_AUTH_NAVER_ENABLED: 'false'
          EXPO_PUBLIC_AUTH_APPLE_ENABLED: 'false'
        run: |
          set -euo pipefail
          npx --yes expo prebuild --platform android --clean --no-install
          # prebuild 결과가 Preview 패키지인지 먼저 확인해 정식 패키지 유출을 막는다.
          if ! grep -rq "$EXPECTED_PACKAGE" android/app/build.gradle android/app/src/main/AndroidManifest.xml; then
            echo "::error::prebuild 결과에서 $EXPECTED_PACKAGE 를 찾지 못했습니다. 중단합니다."
            exit 1
          fi
          ( cd android && ./gradlew --no-daemon assembleRelease )
          BUILT="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -1)"
          if [ -z "$BUILT" ] || [ ! -s "$BUILT" ]; then
            echo "::error::자체 서명 빌드가 APK를 만들지 못했습니다(조용한 성공 금지)."
            exit 1
          fi
          cp "$BUILT" "$APK_NAME"

      - name: APK 패키지·무결성 검증
        id: apk
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          APK_PATH="$PWD/$APK_NAME"

          SHA256="$(sha256sum "$APK_PATH" | cut -d' ' -f1)"
          SIZE_BYTES="$(stat -c%s "$APK_PATH")"
          SIZE_MB="$(node -p "($SIZE_BYTES/1024/1024).toFixed(1)")"
          echo "SHA-256=$SHA256"
          echo "크기=${SIZE_MB}MB (${SIZE_BYTES} bytes)"

          # AndroidManifest 존재 확인
          if ! unzip -p "$APK_PATH" AndroidManifest.xml > /tmp/manifest.bin 2>/dev/null || [ ! -s /tmp/manifest.bin ]; then
            echo "::error::APK 안에 AndroidManifest.xml이 없습니다. 손상된 산출물입니다."
            exit 1
          fi

          # 패키지명 추출: aapt2 → aapt → apkanalyzer → 바이너리 문자열 순으로 시도
          PACKAGE=""
          for TOOL in "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 \
                      "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt; do
            [ -x "$TOOL" ] || continue
            BADGING="$("$TOOL" dump badging "$APK_PATH" 2>/dev/null || true)"
            PACKAGE="$(printf '%s\n' "$BADGING" | grep -m1 "^package: name=" | cut -d"'" -f2 || true)"
            [ -n "$PACKAGE" ] && break
          done
          if [ -z "$PACKAGE" ] && command -v apkanalyzer >/dev/null 2>&1; then
            PACKAGE="$(apkanalyzer manifest application-id "$APK_PATH" 2>/dev/null || true)"
          fi
          if [ -z "$PACKAGE" ]; then
            echo "AAPT 계열 도구를 찾지 못해 바이너리 매니페스트 문자열로 확인합니다."
            if strings -e l /tmp/manifest.bin | grep -Fxq "$EXPECTED_PACKAGE"; then
              PACKAGE="$EXPECTED_PACKAGE"
            elif strings -e l /tmp/manifest.bin | grep -Fxq "$FORBIDDEN_PACKAGE"; then
              PACKAGE="$FORBIDDEN_PACKAGE"
            fi
          fi

          if [ -z "$PACKAGE" ]; then
            echo "::error::APK 패키지명을 확인하지 못했습니다. 정식 앱 유출을 배제할 수 없어 실패 처리합니다."
            exit 1
          fi
          if [ "$PACKAGE" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::APK 패키지가 $PACKAGE 입니다. Preview 전용 $EXPECTED_PACKAGE 가 아니므로 중단합니다."
            exit 1
          fi
          echo "패키지 검증 통과: $PACKAGE"

          {
            echo "sha256=$SHA256"
            echo "size_bytes=$SIZE_BYTES"
            echo "size_mb=$SIZE_MB"
            echo "package=$PACKAGE"
            echo "path=$APK_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: 빌드 요약 기록
        run: |
          {
            echo "## 러닝봄 Preview APK"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 패키지 | \`${{ steps.apk.outputs.package }}\` |"
            echo "| 버전 | ${{ steps.version.outputs.app_version }} |"
            echo "| versionCode | ${{ steps.version.outputs.version_code }} |"
            echo "| 크기 | ${{ steps.apk.outputs.size_mb }} MB |"
            echo "| SHA-256 | \`${{ steps.apk.outputs.sha256 }}\` |"
            echo "| 커밋 | \`${GITHUB_SHA::7}\` |"
            echo ""
            echo "정식 앱 \`kr.robom.runningbom\`(Play 비공개 테스트)은 이 워크플로가 전혀 건드리지 않습니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 워크플로 아티팩트 업로드
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runningbom-preview-apk
          path: apps/mobile/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: 릴리스 본문 작성
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        run: |
          set -euo pipefail
          {
            echo "## 러닝봄 Preview APK"
            echo ""
            echo "정식 러닝봄 앱과 **따로 설치되는 미리보기 앱**입니다. 정식 앱(Play 비공개 테스트)은 그대로 두고 함께 쓰셔도 됩니다."
            echo ""
            if [ "${{ steps.signing.outputs.mode }}" = "selfsigned" ]; then
              echo "> ⚠️ **이 빌드는 자체 서명본입니다.** 저장소에 EXPO_TOKEN이 없어 기존 Preview와 다른 키로 서명됐습니다."
              echo "> 그래서 **기존에 깔린 \"러닝봄 Preview\"를 먼저 삭제한 뒤** 설치해야 하고, 그 앱에 쌓인 기록은 초기화됩니다."
              echo "> 저장소 Settings → Secrets에 EXPO_TOKEN을 넣으면 다음 빌드부터는 삭제 없이 덮어쓰기 업데이트됩니다."
              echo ""
            fi
            echo "### 설치 방법"
            echo "1. 아래 \`runningbom-preview.apk\`를 안드로이드 폰에서 직접 내려받습니다."
            echo "2. 처음이라면 \"알 수 없는 출처의 앱 설치\"를 허용해 달라는 안내가 뜹니다. 사용하는 브라우저(크롬 등)에 허용해 주세요."
            echo "3. 내려받은 파일을 눌러 설치합니다."
            echo "4. 이미 러닝봄 Preview가 설치돼 있다면 **삭제하지 말고 그대로 설치**하면 덮어쓰기 업데이트됩니다."
            echo ""
            echo "### 확인 정보"
            echo "- 앱 이름: 러닝봄 Preview"
            echo "- 패키지: \`${{ steps.apk.outputs.package }}\`"
            echo "- 버전: ${{ steps.version.outputs.app_version }} (versionCode ${{ steps.version.outputs.version_code }})"
            echo "- 크기: ${{ steps.apk.outputs.size_mb }} MB"
            echo "- SHA-256: \`${{ steps.apk.outputs.sha256 }}\`"
            echo "- 소스 커밋: \`${GITHUB_SHA}\`"
            echo ""
            echo "### 안내"
            echo "- 이 APK는 정식 앱 \`kr.robom.runningbom\`과 **별개 패키지**라 서로의 데이터·설치본에 영향을 주지 않습니다."
            echo "- Play 스토어 비공개 테스트와 무관하며, 이 빌드는 Play에 올라가지 않습니다."
            echo "- Preview에서는 소셜 로그인·외부 공유 기능이 기본으로 꺼져 있습니다."
            echo "- 항상 최신본은 \`preview-latest\` 릴리스에서 받을 수 있습니다."
          } > /tmp/release-notes.md

      # 버전 태그 릴리스: 이력 보존용. 이미 있으면 자산만 교체한다.
      - name: 버전 태그 릴리스 게시
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "apps/mobile/$APK_NAME" --clobber
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" "apps/mobile/$APK_NAME" \
              --title "러닝봄 Preview ${{ steps.version.outputs.app_version }} (${{ steps.version.outputs.version_code }})" \
              --notes-file /tmp/release-notes.md \
              --target "$GITHUB_SHA" \
              --prerelease
          fi

      # preview-latest: 사용자가 항상 같은 주소로 최신본을 받는 고정 링크.
      - name: 최신 릴리스(preview-latest) 갱신
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete preview-latest --yes --cleanup-tag || true
          gh release create preview-latest "apps/mobile/$APK_NAME" \
            --title "러닝봄 Preview 최신본 (${{ steps.version.outputs.app_version }} · ${{ steps.version.outputs.version_code }})" \
            --notes-file /tmp/release-notes.md \
            --target "$GITHUB_SHA" \
            --prerelease

      - name: 인앱 업데이트 매니페스트 최신 여부 점검
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        run: |
          set -euo pipefail
          MANIFEST=outputs/pushrun-site/preview/version.json
          MANIFEST_CODE="$(node -p "require('./$MANIFEST').versionCode")"
          if [ "$MANIFEST_CODE" != "${{ steps.version.outputs.version_code }}" ]; then
            {
              echo ""
              echo "> [!WARNING]"
              echo "> \`$MANIFEST\`의 versionCode가 \`$MANIFEST_CODE\`로 이번 빌드(${{ steps.version.outputs.version_code }})보다 낮습니다."
              echo "> 앱 안의 업데이트 배너가 뜨게 하려면 아래 값으로 커밋해 주세요."
              echo ""
              echo '```json'
              echo "  \"latestVersion\": \"${{ steps.version.outputs.app_version }}\","
              echo "  \"versionCode\": ${{ steps.version.outputs.version_code }},"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$MANIFEST 의 versionCode($MANIFEST_CODE)가 이번 빌드(${{ steps.version.outputs.version_code }})와 다릅니다. 인앱 배너를 위해 갱신이 필요합니다."
          else
            echo "매니페스트 versionCode 일치: $MANIFEST_CODE"
          fi
