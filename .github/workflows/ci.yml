# 러닝봄 웹 정본과 Android·iOS 네이티브 출시 계약을 함께 검증한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci
      - name: Diff check
        run: git diff --check
      - name: Web and data tests
        run: npm test
      - name: Web compatibility build
        run: npm run build
      - name: Critical onboarding flow
        working-directory: apps/mobile
        run: npx tsx --test tests/onboarding.test.ts tests/permission-priming.test.ts
      - name: Critical program activity flow
        working-directory: apps/mobile
        run: npx tsx --test tests/program-activity.test.ts
      - name: Critical race and static-data trust
        working-directory: apps/mobile
        run: npx tsx --test tests/race-security.test.ts tests/static-data.test.ts
      - name: Critical share growth flow
        working-directory: apps/mobile
        run: npx tsx --test tests/share-growth.test.ts
      - name: Mobile tests A-B
        working-directory: apps/mobile
        shell: bash
        run: |
          mapfile -t files < <(find tests -type f -name '*.test.ts' -printf '%f %p\n' | sort | awk '$1 ~ /^[a-b]/ {print $2}')
          if ((${#files[@]} > 0)); then npx tsx --test "${files[@]}"; fi
      - name: Mobile tests CA-CH
        working-directory: apps/mobile
        shell: bash
        run: |
          mapfile -t files < <(find tests -type f -name '*.test.ts' -printf '%f %p\n' | sort | awk '$1 ~ /^ca/ || $1 ~ /^ch/ {print $2}')
          if ((${#files[@]} > 0)); then npx tsx --test "${files[@]}"; fi
      - name: Mobile tests COA
        working-directory: apps/mobile
        shell: bash
        run: |
          mapfile -t files < <(find tests -type f -name '*.test.ts' -printf '%f %p\n' | sort | awk '$1 ~ /^coa/ {print $2}')
          if ((${#files[@]} > 0)); then npx tsx --test "${files[@]}"; fi
      - name: Mobile tests COM
        working-directory: apps/mobile
        shell: bash
        run: |
          mapfile -t files < <(find tests -type f -name '*.test.ts' -printf '%f %p\n' | sort | awk '$1 ~ /^com/ {print $2}')
          if ((${#files[@]} > 0)); then npx tsx --test "${files[@]}"; fi
      - name: Mobile tests CON
        working-directory: apps/mobile
        shell: bash
        run: |
          mapfile -t files < <(find tests -type f -name '*.test.ts' -printf '%f %p\n' | sort | awk '$1 ~ /^con/ {print $2}')
          if ((${#files[@]} > 0)); then npx tsx --test "${files[@]}"; fi
      - name: Mobile tests CO other
        working-directory: apps/mobile
        shell: bash
        run: |
          mapfile -t files < <(find tests -type f -name '*.test.ts' -printf '%f %p\n' | sort | awk '$1 ~ /^co/ && $1 !~ /^coa/ && $1 !~ /^com/ && $1 !~ /^con/ {print $2}')
          if ((${#files[@]} > 0)); then npx tsx --test "${files[@]}"; fi
      - name: Mobile tests C other
        working-directory: apps/mobile
        shell: bash
        run: |
          mapfile -t files < <(find tests -type f -name '*.test.ts' -printf '%f %p\n' | sort | awk '$1 ~ /^c/ && $1 !~ /^ca/ && $1 !~ /^ch/ && $1 !~ /^co/ {print $2}')
          if ((${#files[@]} > 0)); then npx tsx --test "${files[@]}"; fi
      - name: Mobile tests D-F
        working-directory: apps/mobile
        shell: bash
        run: |
          mapfile -t files < <(find tests -type f -name '*.test.ts' -printf '%f %p\n' | sort | awk '$1 ~ /^[d-f]/ {print $2}')
          if ((${#files[@]} > 0)); then npx tsx --test "${files[@]}"; fi
      - name: Mobile tests G-L
        working-directory: apps/mobile
        shell: bash
        run: |
          mapfile -t files < <(find tests -type f -name '*.test.ts' -printf '%f %p\n' | sort | awk '$1 ~ /^[g-l]/ {print $2}')
          if ((${#files[@]} > 0)); then npx tsx --test "${files[@]}"; fi
      - name: Mobile tests M-R
        working-directory: apps/mobile
        shell: bash
        run: |
          mapfile -t files < <(find tests -type f -name '*.test.ts' -printf '%f %p\n' | sort | awk '$1 ~ /^[m-r]/ {print $2}')
          if ((${#files[@]} > 0)); then npx tsx --test "${files[@]}"; fi
      - name: Mobile tests S-Z
        working-directory: apps/mobile
        shell: bash
        run: |
          mapfile -t files < <(find tests -type f -name '*.test.ts' -printf '%f %p\n' | sort | awk '$1 ~ /^[s-z]/ {print $2}')
          if ((${#files[@]} > 0)); then npx tsx --test "${files[@]}"; fi
      - name: Mobile TypeScript
        run: npm --prefix apps/mobile run typecheck
      - name: Mobile release contract
        run: npm --prefix apps/mobile run verify
      - name: Expo public configuration
        run: npm --prefix apps/mobile run config
      - name: Production dependency audit
        run: npm run audit:prod
