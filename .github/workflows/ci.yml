# 러닝봄 웹 정본과 Android·iOS 네이티브 출시 계약을 함께 검증한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci
      - name: Diff check
        run: git diff --check
      - name: Web and data tests
        run: npm test
      - name: Web compatibility build
        run: npm run build
      - name: Mobile rule tests
        run: npm --prefix apps/mobile test
      - name: Mobile TypeScript
        run: npm --prefix apps/mobile run typecheck
      - name: Mobile release contract
        run: npm --prefix apps/mobile run verify
      - name: Expo public configuration
        run: npm --prefix apps/mobile run config
      - name: Production dependency audit
        run: npm run audit:prod
