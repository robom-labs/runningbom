name: Bounded official course discovery and metadata-only publication
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: runningbom-data-writer
  cancel-in-progress: false
jobs:
  course-data:
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install locked collector dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Contracts and new-event lifecycle before collection
        run: COURSE_REQUIRE_CLEAN_INSTALL=1 node --test scripts/course-discovery.test.mjs scripts/course-discovery-rejections.test.mjs scripts/course-metadata-inputs.test.mjs scripts/course-data-publication.test.mjs scripts/course-source-refresh-core.test.mjs scripts/course-meta-refresh.test.mjs scripts/course-tooling-dependencies.test.mjs scripts/course-discovery-frontier.test.mjs
      - name: Discover current seeds, rotating by persisted last actual attempt
        # Cold-start works without the old447-request audit. All current IDs are classified;
        # 64 total HTTP GETs/run and4/race INCLUDING robots+redirects. No image binaries committed.
        run: node scripts/course-discover-sources.mjs --ci-staging --without-audit --live --max-requests 64 --write-index --accept-images --out-dir "$RUNNER_TEMP/course-discovery"
      - name: Existing source-bound GPX refresh and DEM pipeline
        run: |
          node scripts/refresh-approved-course-sources.mjs --write
          node scripts/update-course-elevation.mjs --refresh --osm-api
          node scripts/update-course-elevation.mjs --check
      - name: Generate SAME catalog courses plus verified slim pages
        run: |
          node scripts/publish-course-catalog.mjs --remote-only
          node scripts/publish-course-catalog.mjs --remote-only --check
          node scripts/course-data-publication.mjs --check
          node --test scripts/course-catalog-pipeline.test.mjs
      - name: Retain bounded receipts and quarantine reasons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: official-course-discovery-evidence
          path: |
            ${{ runner.temp }}/course-discovery/coverage-candidate.json
            ${{ runner.temp }}/course-discovery/course-image-acceptance.json
            ${{ runner.temp }}/course-discovery/course-gpx-dem-handoff.json
            data/course-source-index.json
            data/course-source-seeds.json
            data/course-base.json
            data/course-elevation.json
            data/course-catalog.json
            data/course-catalog.manifest.json
          retention-days: 30
      - name: Persist metadata against fresh main CAS, never overwrite another writer
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages" | node scripts/course-data-publication.mjs --assert-pages
          git config user.name robom-data-bot
          git config user.email actions@github.com
          BASE=$(git rev-parse HEAD)
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git add -- data/course-base.json data/course-elevation.json data/course-approved-images.json data/course-source-index.json data/course-catalog.json data/course-catalog.manifest.json
          test -z "$(git diff --cached --name-only | sed '/^data\/course-base\.json$/d; /^data\/course-elevation\.json$/d; /^data\/course-approved-images\.json$/d; /^data\/course-source-index\.json$/d; /^data\/course-catalog\.json$/d; /^data\/course-catalog\.manifest\.json$/d')"
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): validated official course images and pages [skip ci]"
            git push origin HEAD:main
          fi
      - name: Overlay ONLY catalog pair onto latest gh-pages CAS
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          SITE="$RUNNER_TEMP/course-existing-gh-pages"
          SITE_BASE=$(git rev-parse origin/gh-pages)
          git worktree add --detach "$SITE" "$SITE_BASE"
          node scripts/course-data-publication.mjs --site-dir "$SITE"
          git -C "$SITE" add -- data/course-catalog.json data/course-catalog.manifest.json
          test -z "$(git -C "$SITE" diff --cached --name-only | sed '/^data\/course-catalog\.json$/d; /^data\/course-catalog\.manifest\.json$/d')"
          git fetch origin gh-pages
          test "$(git rev-parse origin/gh-pages)" = "$SITE_BASE"
          if ! git -C "$SITE" diff --cached --quiet; then
            git -C "$SITE" commit -m "chore(data): official course metadata pair only [skip ci]"
            git -C "$SITE" push origin HEAD:gh-pages
          fi
          gh api "repos/$GITHUB_REPOSITORY/pages" | node scripts/course-data-publication.mjs --assert-pages
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '{status: .status}'
      - name: Actual public pair and preserved site-byte readback
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/course-data-publication.mjs --verify-public --site-dir "$RUNNER_TEMP/course-existing-gh-pages"; then exit 0; fi
            sleep 20
          done
          exit 1
