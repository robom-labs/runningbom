name: Deploy runningbom Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: 네이티브·생성기 의존성 설치
        run: npm --prefix apps/mobile ci
      - name: JavaScript 문법 검사
        run: node --check outputs/pushrun-site/app.js && node --check outputs/pushrun-site/family-analytics.js && node --check outputs/pushrun-site/family-shell.js && node --check outputs/pushrun-site/sw.js && node --check outputs/pushrun-site/alerts-core.js && node --check outputs/pushrun-site/race-calendar-core.js
      - name: 정적 자산·대회 데이터 검사
        run: npm test
      - name: 모바일 테스트
        run: npm --prefix apps/mobile test
      - name: 모바일 타입 검사
        run: npm --prefix apps/mobile run typecheck
      - name: 모바일 출시 설정 검사
        run: npm --prefix apps/mobile run verify
      - name: Expo 공개 설정 검사
        run: npm --prefix apps/mobile run config
      - name: Android·iOS 번들 내보내기
        run: npm --prefix apps/mobile run export:native
      - name: Production dependency audit
        run: npm run audit:prod

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 운영 빌드 식별자 기록
        shell: bash
        run: |
          mkdir -p .pages-release
          cp -a outputs/pushrun-site/. .pages-release/
          mkdir -p .pages-release/data
          cp -a data/. .pages-release/data/
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA::7}/g" .pages-release/app.js

      - name: Deploy static site to gh-pages
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .pages-release
