name: Deploy runningbom Pages

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # 데이터 갱신 뒤 배포 요청이 누락돼도 KST 03:47에 main 정본을 다시 배포한다.
    - cron: "47 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: 네이티브·정적 데이터 의존성 설치
        run: npm --prefix apps/mobile ci
      - name: JavaScript 문법 검사
        run: node --check outputs/pushrun-site/app.js && node --check outputs/pushrun-site/family-analytics.js && node --check outputs/pushrun-site/family-shell.js && node --check outputs/pushrun-site/sw.js && node --check outputs/pushrun-site/alerts-core.js && node --check outputs/pushrun-site/race-calendar-core.js
      - name: 정적 자산·대회 데이터 검사
        run: npm test
      - name: Android·iOS 네이티브 검증
        run: npm --prefix apps/mobile run check && npm --prefix apps/mobile run export:native
      - name: Production dependency audit
        run: npm run audit:prod

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 운영 빌드 식별자 기록
        shell: bash
        run: |
          mkdir -p .pages-release
          cp -a outputs/pushrun-site/. .pages-release/
          mkdir -p .pages-release/data
          cp -a data/. .pages-release/data/
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA::7}/g" .pages-release/app.js

      - name: Deploy static site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .pages-release
