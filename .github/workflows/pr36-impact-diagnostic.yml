name: PR36 impacted mobile tests

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/pr36-impact-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: list
        shell: bash
        run: |
          pattern='onboardingStep|buildOnboardingSteps|renderLoginStep|AuthScreen|AppNavigator|ProgramsScreen|finishSession|activityFromProgramAttempt|app.json|expoConfig|description'
          files=$(grep -rlE "$pattern" apps/mobile/tests --include='*.test.ts' | sed 's#^apps/mobile/##' | sort -u | jq -R -s -c 'split("\n")[:-1]')
          if [ "$files" = '[]' ]; then
            files='["tests/onboarding.test.ts","tests/program-activity.test.ts"]'
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    name: impacted ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm --prefix apps/mobile ci
      - run: cd apps/mobile && npx tsx --test "${{ matrix.file }}"
