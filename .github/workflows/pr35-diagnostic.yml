name: PR35 diagnostic

on:
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci
      - name: Generate expected static data through tsx
        run: npm run static-data:generate
      - name: Commit deterministic generated data
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/runningbom-1m-audit-clean-20260727'
        run: |
          if git diff --quiet -- data apps/mobile/data/fallback; then
            echo "generated data already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data apps/mobile/data/fallback
          git commit -m "chore(data): regenerate static sidecars"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Static data check
        if: always()
        run: npm run static-data:check
      - name: Static UI contract
        if: always()
        run: node scripts/validate-static.mjs
      - name: Root script tests
        if: always()
        run: node --test "scripts/*.test.mjs"
      - name: Mobile tests
        if: always()
        run: npm --prefix apps/mobile test
      - name: Mobile typecheck
        if: always()
        run: npm --prefix apps/mobile run typecheck
