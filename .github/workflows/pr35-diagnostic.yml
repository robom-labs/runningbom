name: PR35 diagnostic

on:
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci
      - name: Family lock
        if: always()
        run: node scripts/verify-family.mjs generated/robom-family family.lock.json
      - name: Static family sync
        if: always()
        run: node scripts/sync-family-static.mjs --check
      - name: Mobile race sync
        if: always()
        run: node scripts/sync-mobile-races.mjs --check
      - name: Static data generation check through tsx
        if: always()
        run: npm run static-data:check
      - name: Generate expected static data through tsx
        if: always()
        run: npm run static-data:generate
      - name: Diff data races
        if: always()
        run: git diff --exit-code -- data/races.json apps/mobile/data/fallback/races.json
      - name: Diff data shoes
        if: always()
        run: git diff --exit-code -- data/shoes.json apps/mobile/data/fallback/shoes.json
      - name: Diff upcoming shoes
        if: always()
        run: git diff --exit-code -- data/upcoming-shoes.json apps/mobile/data/fallback/upcoming-shoes.json
      - name: Diff coaching
        if: always()
        run: git diff --exit-code -- data/coaching.json apps/mobile/data/fallback/coaching.json
      - name: Diff manifests
        if: always()
        run: git diff --exit-code -- data/manifest.json apps/mobile/data/fallback/manifest.json
      - name: Static data validation
        if: always()
        run: node scripts/static-data-validate.mjs
      - name: Static UI contract
        if: always()
        run: node scripts/validate-static.mjs
      - name: Root script tests after regeneration
        if: always()
        run: node --test "scripts/*.test.mjs"
      - name: Mobile tests
        if: always()
        run: npm --prefix apps/mobile test
      - name: Mobile typecheck
        if: always()
        run: npm --prefix apps/mobile run typecheck
