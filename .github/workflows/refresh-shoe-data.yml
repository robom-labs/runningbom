name: Refresh running shoe data

# 러닝화 카탈로그를 주 1회 점검한다.
# - 외부 사이트를 크롤링하지 않는다(약관·차단 위험). 자동화는 무결성 검사와 "사람이 확인할 목록" 생성까지만 한다.
# - 검증에 실패하면 워크플로를 실패시킨다.
# - 변경이 있으면 main 직접 push 대신 PR을 만든다. 변경이 없으면 조용히 종료한다.
on:
  schedule:
    # 매주 월요일 KST 08:20 (UTC 일요일 23:20)
    - cron: "20 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: running-shoe-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 모바일 의존성 설치 (TypeScript 정본 로딩용)
        run: npm --prefix apps/mobile ci
      - name: 러닝화 카탈로그 무결성 점검 및 확인 큐 생성
        run: node --import ./apps/mobile/node_modules/tsx/dist/loader.mjs scripts/refresh-shoe-data.mjs --write
      - name: 러닝화 도메인 단위 테스트
        run: npm --prefix apps/mobile test
      - name: 확인 큐 리포트 보관
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: running-shoe-verification-queue
          path: data/shoe-verification-queue.json
          if-no-files-found: error
      - name: 변경이 있으면 PR 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/shoe-verification-queue.json; then
            echo "러닝화 확인 큐 변경이 없습니다. 조용히 종료합니다."
            exit 0
          fi
          BRANCH="chore/shoe-data-refresh-$(date -u +%Y%m%d)"
          git config user.name "robom-data-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add data/shoe-verification-queue.json
          git commit -m "chore(shoes): 러닝화 공식 확인 큐 갱신"
          git push --force-with-lease origin "$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "이미 열린 PR이 있습니다. 브랜치만 갱신했습니다."
            exit 0
          fi
          {
            echo "자동 점검 결과 러닝화 공식 확인 큐가 바뀌었습니다."
            echo
            echo "- 외부 사이트를 수집하지 않았습니다. 아래 목록은 사람이 브랜드 공식 페이지에서 확인할 대상입니다."
            echo "- 무결성 검사(중복 id·카테고리 조합·comparedTo 참조·금지 필드·금지 문자열)는 통과한 상태입니다."
            echo
            node --import ./apps/mobile/node_modules/tsx/dist/loader.mjs scripts/refresh-shoe-data.mjs
          } > /tmp/shoe-pr-body.md
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(shoes): 러닝화 공식 확인 큐 갱신" \
            --body-file /tmp/shoe-pr-body.md
