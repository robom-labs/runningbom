<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8f4" />
    <meta name="robots" content="noindex, nofollow" />
    <title>러닝봄 Preview</title>
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>
    <div class="preview-banner" role="status">
      <strong>러닝봄 작업 중 미리보기</strong>
      <span>운영 앱·비공개 테스트에는 아직 반영되지 않았습니다.</span>
    </div>
    <div class="app-shell">
      <header class="app-header">
        <button class="brand" type="button" data-tab="홈" aria-label="러닝봄 홈으로 이동">
          <span class="brand-mark" aria-hidden="true">⌁</span>
          <span><strong>러닝봄</strong><small>robom · 출발선에 서는 날</small></span>
        </button>
        <button class="profile-button" type="button" data-tab="마이" aria-label="마이 화면으로 이동">JP</button>
      </header>

      <main id="screen" tabindex="-1"></main>

      <nav class="tabbar" aria-label="러닝봄 주요 메뉴">
        <button type="button" data-tab="홈"><span>⌂</span>홈</button>
        <button type="button" data-tab="탐색"><span>⌕</span>탐색</button>
        <button type="button" data-tab="시작"><span>▶</span>시작</button>
        <button type="button" data-tab="커뮤니티"><span>◌</span>커뮤니티</button>
        <button type="button" data-tab="마이"><span>☺</span>마이</button>
      </nav>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
